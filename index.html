<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カラータイル2</title>
  </head>
  <body>
    <main>
      <!-- タイトル画面 -->
      <section id="title-screen" class="title-screen">
        <div id="title-tiles" class="title-tiles" aria-hidden="true"></div>
        <h1 class="title-logo">カラータイル2</h1>
        <div class="title-form">
          <div class="tabs" role="group" aria-label="モード">
            <button data-mode="solo">ひとりで</button>
            <button data-mode="versus">AIと対戦</button>
          </div>
          <label class="difficulty-field">
            AIの強さ
            <select id="difficulty"></select>
          </label>
          <button id="play" class="play-button">Play</button>
        </div>
      </section>

      <!-- ゲーム画面 -->
      <section id="game-screen" hidden>
        <nav class="topbar">
          <h1>カラータイル2</h1>
          <button id="back-to-title">タイトルに戻る</button>
        </nav>
        <div id="banner" class="banner" hidden></div>
        <div id="panels"></div>
      </section>

      <div id="countdown" class="countdown" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
